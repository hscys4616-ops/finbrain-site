name: Deploy homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip site
        run: |
          shopt -s nullglob
          zips=( *.zip )
          echo "zip files: ${zips[*]}"
          if [ ${#zips[@]} -ne 1 ]; then
            echo "ERROR: zip file count must be 1 (now ${#zips[@]})"; exit 1
          fi
          mkdir -p _unz _site
          unzip -q "${zips[0]}" -d _unz
          entries=( _unz/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -r "${entries[0]}"/. _site/
          else
            cp -r _unz/. _site/
          fi
          test -f _site/index.html || { echo "ERROR: no index.html"; exit 1; }
          ls -la _site

      # v0.9.10: 사업자등록번호 · 통신판매업 신고번호 · 게임제작업 등록번호는 저장소에 쓰지 않고 Secret에서 넣음
      - name: Fill business info from secrets
        env:
          BIZ_REG_NO: ${{ secrets.BIZ_REG_NO }}
          MAILORDER_NO: ${{ secrets.MAILORDER_NO }}
          GAME_REG_NO: ${{ secrets.GAME_REG_NO }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib
          reg = os.environ.get("BIZ_REG_NO", "").strip()
          mo = os.environ.get("MAILORDER_NO", "").strip()
          gr = re.sub(r"\s", "", os.environ.get("GAME_REG_NO", ""))
          if not re.fullmatch(r"\d{3}-\d{2}-\d{5}", reg):
              sys.exit("ERROR: secret BIZ_REG_NO missing or not in 000-00-00000 form")
          if not mo or len(mo) > 60 or re.search(r"[<>\"&]", mo):
              sys.exit("ERROR: secret MAILORDER_NO missing or has invalid characters")
          g = re.fullmatch(r"제?(\d{4})-(\d{6})호?", gr)
          if not g:
              sys.exit("ERROR: secret GAME_REG_NO missing or not in 2026-000000 form")
          game = f"제{g.group(1)}-{g.group(2)}호"
          digits = reg.replace("-", "")
          n = 0
          for p in pathlib.Path("_site").rglob("*.html"):
              s = p.read_text(encoding="utf-8")
              t = (s.replace("__BIZ_REG_NO__", reg)
                    .replace("__MAILORDER_NO__", mo)
                    .replace("__BIZ_REG_DIGITS__", digits)
                    .replace("__GAME_REG_NO__", game))
              if t != s:
                  p.write_text(t, encoding="utf-8"); n += 1
          print(f"filled {n} files")
          if n == 0:
              sys.exit("ERROR: no placeholders found")
          PY
          if grep -rl "__BIZ_REG_NO__\|__MAILORDER_NO__\|__BIZ_REG_DIGITS__\|__GAME_REG_NO__" _site; then
            echo "ERROR: placeholder left"; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
